name: Nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  live-rpc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - run: npm ci
      - run: npx vitest run --project live
      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One issue per failing tier, not one per night. A sustained outage
          # used to open a fresh issue every run — 13 duplicates for two root
          # causes — which buries anything real. Comment on the open one instead.
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TITLE="Nightly live-RPC run failing"
          EXISTING=$(gh issue list --state open --label nightly-failure \
            --search "\"$TITLE\" in:title" --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Still failing: $RUN_URL" || true
          else
            gh issue create --title "$TITLE" --body "Run: $RUN_URL" --label nightly-failure || true
          fi
  fork:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0
        with:
          # Pinned, not `stable`: anvil 1.8 changed auto-mining to be async and
          # silently reddened the workstyle gate and the nightly fork run for 9
          # days with no code change (#49). Toolchain upgrades should be a
          # deliberate commit, not a surprise from a scheduled run.
          version: v1.8.1
      - name: Install solc 0.8.24 (static binary)
        run: |
          curl -sSL -o /usr/local/bin/solc \
            https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.8.24+commit.e11b9ed9
          echo "fb03a29a517452b9f12bcf459ef37d0a543765bb3bbc911e70a87d6a37c30d5f  /usr/local/bin/solc" | sha256sum -c
          chmod +x /usr/local/bin/solc
      - run: npm ci
      - run: npx vitest run --project fork
        env:
          WORKSTYLE_FORK: '1'
          # Only set when a keyed endpoint is configured. Hardcoding a default
          # here would override the suite's built-in candidate list and disable
          # the fallback, which is what kept the fork job red: one throttled
          # provider failed the whole run. Empty means "use the candidates".
          WORKSTYLE_FORK_URL: ${{ secrets.FORK_RPC_URL }}
      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One issue per failing tier, not one per night. A sustained outage
          # used to open a fresh issue every run — 13 duplicates for two root
          # causes — which buries anything real. Comment on the open one instead.
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TITLE="Nightly fork run failing"
          EXISTING=$(gh issue list --state open --label nightly-failure \
            --search "\"$TITLE\" in:title" --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Still failing: $RUN_URL" || true
          else
            gh issue create --title "$TITLE" --body "Run: $RUN_URL" --label nightly-failure || true
          fi
  testnet:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - name: Install solc 0.8.24 (static binary)
        run: |
          curl -sSL -o /usr/local/bin/solc \
            https://binaries.soliditylang.org/linux-amd64/solc-linux-amd64-v0.8.24+commit.e11b9ed9
          echo "fb03a29a517452b9f12bcf459ef37d0a543765bb3bbc911e70a87d6a37c30d5f  /usr/local/bin/solc" | sha256sum -c
          chmod +x /usr/local/bin/solc
      - run: npm ci
      - run: npx vitest run --project testnet
        env:
          TESTNET_PRIVATE_KEY: ${{ secrets.TESTNET_PRIVATE_KEY }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
  agent-scenarios:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      - uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1.9.0
        with:
          # Pinned, not `stable`: anvil 1.8 changed auto-mining to be async and
          # silently reddened the workstyle gate and the nightly fork run for 9
          # days with no code change (#49). Toolchain upgrades should be a
          # deliberate commit, not a surprise from a scheduled run.
          version: v1.8.1
      # No solc install here: compile_contract resolves Docker first (present
      # on ubuntu-latest runners) and only falls back to a local solc binary.
      - run: npm ci
      - run: npm run test:scenarios
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # One issue per failing tier, not one per night. A sustained outage
          # used to open a fresh issue every run — 13 duplicates for two root
          # causes — which buries anything real. Comment on the open one instead.
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          TITLE="Nightly agent-scenarios run failing"
          EXISTING=$(gh issue list --state open --label nightly-failure \
            --search "\"$TITLE\" in:title" --json number,title \
            --jq ".[] | select(.title == \"$TITLE\") | .number" | head -1)
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "Still failing: $RUN_URL" || true
          else
            gh issue create --title "$TITLE" --body "Run: $RUN_URL" --label nightly-failure || true
          fi
