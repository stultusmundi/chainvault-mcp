# Publishes via npm Trusted Publishing (OIDC) — no NPM_TOKEN secret needed.
# Both packages must list this repo + workflow as a Trusted Publisher on npmjs.com.
name: Publish

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # OIDC token exchange with npm + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: npm
      # Node 22 bundles npm 10; trusted publishing needs npm >= 11.5
      - run: npm install -g npm@11
      - run: npm ci
      - run: npm run build
      - run: npx vitest run --project unit
      # Skip versions that are already on the registry so re-runs (or a release
      # created after a manual publish) stay green instead of failing on E403.
      - name: Publish @chainvault/core
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          if npm view "@chainvault/core@${VERSION}" version >/dev/null 2>&1; then
            echo "@chainvault/core@${VERSION} already published — skipping"
          else
            npm publish -w @chainvault/core --provenance --access public
          fi
      - name: Publish @chainvault/mcp
        run: |
          VERSION=$(node -p "require('./packages/cli/package.json').version")
          if npm view "@chainvault/mcp@${VERSION}" version >/dev/null 2>&1; then
            echo "@chainvault/mcp@${VERSION} already published — skipping"
          else
            npm publish -w @chainvault/mcp --provenance --access public
          fi
